<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridLess Photo</title><style>
*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eee;font:14px system-ui}header{height:58px;background:#1b1e28;border-bottom:1px solid #343846;display:flex;align-items:center;gap:14px;padding:0 18px}a{color:#b9a5ff;text-decoration:none}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 58px)}aside{background:#191c25;border-right:1px solid #343846;padding:16px;display:flex;flex-direction:column;gap:10px}main{padding:22px;min-width:0}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{border:1px solid #414657;background:#272c39;color:#eee;padding:9px;border-radius:9px;cursor:pointer;text-align:center}button:hover{border-color:#a78bfa}.primary{background:#8b70df;color:#100d18;border:0;font-weight:700}label{font-size:12px;color:#aeb4c5;display:block;margin:9px 0 4px}input[type=range]{width:100%}input[type=color]{width:100%;height:35px;background:none;border:0}input[type=file]{width:100%;font-size:12px}.stage{background:#272a34;border:1px solid #424656;border-radius:13px;min-height:65vh;display:grid;place-items:center;padding:22px;overflow:auto}.stage canvas{max-width:100%;max-height:72vh;background:white;box-shadow:0 10px 35px #0008;touch-action:none}.hint{color:#9ba2b5;text-align:center;max-width:400px;line-height:1.7}.tools button{font-size:12px}.wide{grid-column:span 2}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #343846}.tools{grid-template-columns:repeat(4,1fr)}main{padding:10px}.stage{min-height:55vh}}
</style></head><body><header><a href="index.html">← GridLess</a><strong>▧ GridLess Photo</strong><span style="color:#9ba2b5">Browser image editor</span></header><div class="layout"><aside><label>Open image</label><input id="file" type="file" accept="image/*"><div class="tools"><button id="undo">Undo</button><button id="reset">Reset</button><button id="brush">Brush</button><button id="text">Add text</button><button id="fit">Fit image</button><button id="clear">Clear</button></div><label>Brush colour</label><input id="colour" type="color" value="#ff3d7f"><label>Brush size <output id="sizeOut">8</output>px</label><input id="size" type="range" min="1" max="80" value="8"><label>Brightness <output id="brightOut">100</output>%</label><input id="bright" type="range" min="0" max="200" value="100"><label>Contrast <output id="contrastOut">100</output>%</label><input id="contrast" type="range" min="0" max="200" value="100"><label>Saturation <output id="satOut">100</output>%</label><input id="sat" type="range" min="0" max="250" value="100"><button id="download" class="primary">Download PNG</button><p style="font-size:11px;color:#9ba2b5">Edits happen locally in this browser. Download to save your changes.</p></aside><main><div class="stage"><div class="hint" id="hint"><b style="font-size:20px">Your canvas is ready</b><br>Open an image to begin, or draw on a blank canvas.<br><br><button id="blank">Create blank canvas</button></div><canvas id="canvas" hidden width="1200" height="800"></canvas></div></main></div>
<script>
const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),file=document.querySelector('#file');let base=null,history=[],drawing=false,mode='brush',last=null;function snapshot(){if(!c.hidden){history.push(ctx.getImageData(0,0,c.width,c.height));if(history.length>12)history.shift()}}function show(){c.hidden=false;document.querySelector('#hint').hidden=true}function blank(){c.width=1200;c.height=800;ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);base=ctx.getImageData(0,0,c.width,c.height);history=[];show()}document.querySelector('#blank').onclick=blank;file.onchange=()=>{const f=file.files[0];if(!f)return;const im=new Image;im.onload=()=>{c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);base=ctx.getImageData(0,0,c.width,c.height);history=[];show();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{if(c.hidden)return;snapshot();if(mode==='text'){const t=prompt('Text to add');if(t){ctx.fillStyle=document.querySelector('#colour').value;ctx.font='bold '+Math.max(24,c.width/28)+'px system-ui';ctx.fillText(t,point(e).x,point(e).y)}mode='brush';return}drawing=true;last=point(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.strokeStyle=document.querySelector('#colour').value;ctx.lineWidth=+document.querySelector('#size').value*c.width/c.clientWidth;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};c.onpointerup=c.onpointercancel=()=>drawing=false;document.querySelector('#brush').onclick=()=>mode='brush';document.querySelector('#text').onclick=()=>mode='text';document.querySelector('#undo').onclick=()=>{const x=history.pop();if(x)ctx.putImageData(x,0,0)};document.querySelector('#reset').onclick=()=>{if(base){snapshot();ctx.putImageData(base,0,0)}};document.querySelector('#clear').onclick=()=>{if(!c.hidden){snapshot();ctx.clearRect(0,0,c.width,c.height)}};document.querySelector('#fit').onclick=()=>{if(base){c.width=base.width;c.height=base.height;ctx.putImageData(base,0,0)}};[['size','sizeOut'],['bright','brightOut'],['contrast','contrastOut'],['sat','satOut']].forEach(([a,b])=>document.querySelector('#'+a).oninput=e=>document.querySelector('#'+b).value=e.target.value);function download(){if(c.hidden)return alert('Open or create an image first.');const out=document.createElement('canvas');out.width=c.width;out.height=c.height;const x=out.getContext('2d');x.filter='brightness('+document.querySelector('#bright').value+'%) contrast('+document.querySelector('#contrast').value+'%) saturate('+document.querySelector('#sat').value+'%)';x.drawImage(c,0,0);const a=document.createElement('a');a.download='gridless-edit.png';a.href=out.toDataURL('image/png');a.click()}document.querySelector('#download').onclick=download;
</script></body></html>
