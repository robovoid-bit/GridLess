<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridLess Color Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eee;font:14px system-ui}header{height:58px;background:#1b1e28;border-bottom:1px solid #343846;display:flex;align-items:center;gap:16px;padding:0 18px}a{color:#b9a5ff;text-decoration:none}main{max-width:900px;margin:35px auto;padding:0 18px}.panel{background:#1b1e28;border:1px solid #343846;border-radius:14px;padding:20px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit;color:inherit;background:#272c39;border:1px solid #414657;border-radius:8px;padding:9px}button{cursor:pointer}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:20px 0}.swatch{height:155px;border-radius:10px;display:flex;align-items:end;padding:9px;color:white;text-shadow:0 1px 4px #000;font-size:12px;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff22}.muted{font-size:12px;color:#9ba2b5}@media(max-width:600px){.swatches{grid-template-columns:repeat(2,1fr)}.swatch{height:95px}}</style></head><body><header><a href="index.html">← GridLess</a><b>◉ GridLess Color Studio</b></header><main><h1>Find your colours.</h1><p class="muted">Generate a palette, explore harmony and copy colour values.</p><section class="panel"><div class="row"><label>Base colour <input id="base" type="color" value="#8b70df"></label><label>Harmony <select id="mode"><option value="analogous">Analogous</option><option value="complementary">Complementary</option><option value="triadic">Triadic</option><option value="mono">Monochromatic</option></select></label><button id="random">Random palette</button><button id="copy">Copy palette</button></div><div class="swatches" id="swatches"></div><p class="muted" id="status">Click any swatch to copy its HEX value.</p></section></main><script>const base=document.querySelector('#base'),mode=document.querySelector('#mode'),wrap=document.querySelector('#swatches');let colours=[];function hsv(h,s,v){h=(h%360+360)%360;s/=100;v/=100;const c=v*s,x=c*(1-Math.abs(h/60%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return '#'+[r,g,b].map(z=>Math.round((z+m)*255).toString(16).padStart(2,'0')).join('')}function hue(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d){if(max===r)h=60*((g-b)/d%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}return(h+360)%360}function generate(){const h=hue(base.value),sets={analogous:[-40,-20,0,20,40],complementary:[0,18,180,198,200],triadic:[0,120,240,15,195],mono:[0,0,0,0,0]},offset=sets[mode.value];colours=offset.map((o,i)=>mode.value==='mono'?hsv(h,85-i*13,96-i*15):hsv(h+o,75,90-(i%2)*18));wrap.innerHTML='';colours.forEach(c=>{const d=document.createElement('div');d.className='swatch';d.style.background=c;d.textContent=c.toUpperCase();d.onclick=()=>navigator.clipboard.writeText(c).then(()=>document.querySelector('#status').textContent='Copied '+c);wrap.append(d)})}base.oninput=generate;mode.onchange=generate;document.querySelector('#random').onclick=()=>{base.value='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');generate()};document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(colours.join('\n')).then(()=>document.querySelector('#status').textContent='Palette copied');generate();</script></body></html>
