<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridLess Video Desk</title><style>*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eee;font:14px system-ui}header{height:58px;background:#1b1e28;border-bottom:1px solid #343846;display:flex;align-items:center;gap:16px;padding:0 18px}a{color:#b9a5ff;text-decoration:none}main{max-width:1050px;margin:28px auto;padding:0 20px}.panel{background:#1b1e28;border:1px solid #343846;border-radius:14px;padding:18px;margin:14px 0}video{width:100%;max-height:60vh;background:#08090d;border-radius:10px}button,input{font:inherit;color:inherit;background:#272c39;border:1px solid #414657;border-radius:8px;padding:9px}button{cursor:pointer}button:hover{border-color:#a78bfa}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:block;color:#aeb4c5;font-size:12px;margin:12px 0 5px}input[type=range]{width:100%;accent-color:#a78bfa}.muted{color:#9ba2b5;font-size:12px}.range{display:grid;grid-template-columns:1fr 1fr;gap:15px}.primary{background:#8b70df;color:#171321;font-weight:700}@media(max-width:600px){.range{grid-template-columns:1fr}}</style></head><body><header><a href="index.html">← GridLess</a><b>▶ GridLess Video Desk</b><span class="muted">Clip preview & trim</span></header><main><h1>Video Desk</h1><p class="muted">Load a video, set an in/out range and adjust the preview look. Export downloads the original source clip; edits here are preview controls.</p><section class="panel"><div class="row"><input id="file" type="file" accept="video/*"><button id="play">Play / pause</button><button id="start">Set in point</button><button id="end">Set out point</button><button id="download">Download source</button></div><video id="video" controls playsinline></video><p id="time" class="muted">No clip loaded</p></section><section class="panel"><h3>Trim range</h3><div class="range"><div><label>In point <output id="inVal">0.0</output>s</label><input id="in" type="range" min="0" max="100" step=".1" value="0"></div><div><label>Out point <output id="outVal">0.0</output>s</label><input id="out" type="range" min="0" max="100" step=".1" value="100"></div></div><h3>Preview effects</h3><div class="range"><div><label>Brightness <output id="brightVal">100</output>%</label><input id="bright" type="range" min="0" max="200" value="100"></div><div><label>Contrast <output id="contrastVal">100</output>%</label><input id="contrast" type="range" min="0" max="200" value="100"></div><div><label>Saturation <output id="satVal">100</output>%</label><input id="sat" type="range" min="0" max="250" value="100"></div></div></section></main><script>const v=document.querySelector('#video');let url=null;function duration(){return Number.isFinite(v.duration)?v.duration:0}function sync(){const d=duration();document.querySelector('#time').textContent=d?(v.currentTime.toFixed(1)+'s / '+d.toFixed(1)+'s'):'No clip loaded'}document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;v.onloadedmetadata=()=>{const d=duration();[['in',0],['out',d]].forEach(([id,n])=>{const x=document.querySelector('#'+id);x.max=d;x.value=n});labels();sync()}};function labels(){document.querySelector('#inVal').value=(+document.querySelector('#in').value).toFixed(1);document.querySelector('#outVal').value=(+document.querySelector('#out').value).toFixed(1)}['in','out'].forEach(id=>document.querySelector('#'+id).oninput=()=>{labels();if(id==='in'&&v.currentTime<+document.querySelector('#in').value)v.currentTime=+document.querySelector('#in').value;if(id==='out'&&v.currentTime>+document.querySelector('#out').value)v.currentTime=+document.querySelector('#out').value});document.querySelector('#play').onclick=()=>v.paused?v.play():v.pause();document.querySelector('#start').onclick=()=>{document.querySelector('#in').value=v.currentTime;labels()};document.querySelector('#end').onclick=()=>{document.querySelector('#out').value=v.currentTime;labels()};['bright','contrast','sat'].forEach(id=>document.querySelector('#'+id).oninput=()=>{const val=document.querySelector('#'+id).value;document.querySelector('#'+id+'Val').value=val;v.style.filter='brightness('+document.querySelector('#bright').value+'%) contrast('+document.querySelector('#contrast').value+'%) saturate('+document.querySelector('#sat').value+'%)'});v.ontimeupdate=()=>{if(v.currentTime>=+document.querySelector('#out').value&&duration())v.pause();sync()};document.querySelector('#download').onclick=()=>{if(!url)return alert('Load a video first.');const a=document.createElement('a');a.href=url;a.download='gridless-source-video';a.click()};</script></body></html>
