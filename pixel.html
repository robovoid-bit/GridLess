<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridLess Pixel Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eee;font:14px system-ui}header{height:58px;background:#1b1e28;border-bottom:1px solid #343846;display:flex;align-items:center;gap:16px;padding:0 18px}a{color:#b9a5ff;text-decoration:none}main{max-width:850px;margin:30px auto;padding:0 18px}.panel{background:#1b1e28;border:1px solid #343846;border-radius:14px;padding:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button,input,select{font:inherit;color:inherit;background:#272c39;border:1px solid #414657;border-radius:8px;padding:9px}button{cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;width:min(100%,640px);height:auto;aspect-ratio:1;background:white;image-rendering:pixelated;touch-action:none;margin:auto;border:1px solid #555}.primary{background:#8b70df;color:#171321;font-weight:700}.muted{font-size:12px;color:#9ba2b5}</style></head><body><header><a href="index.html">← GridLess</a><b>▦ GridLess Pixel Studio</b></header><main><h1>Pixel Studio</h1><p class="muted">Create tiny sprites, icons and pixel-art scenes.</p><section class="panel"><div class="row"><label>Grid <select id="grid"><option>16</option><option selected>32</option><option>48</option><option>64</option></select></label><label>Colour <input id="colour" type="color" value="#7c5cff"></label><button id="eraser">Eraser</button><button id="clear">Clear</button><button id="download" class="primary">Export PNG</button></div><canvas id="art" width="512" height="512"></canvas><p class="muted">Click or drag across the canvas to paint. PNG exports at 512 × 512 pixels.</p></section></main><script>const c=document.querySelector('#art'),x=c.getContext('2d');let n=32,down=false,erase=false;function blank(){x.fillStyle='#fff';x.fillRect(0,0,512,512);x.strokeStyle='#eee';x.lineWidth=.5;for(let i=1;i<n;i++){x.beginPath();x.moveTo(i*512/n,0);x.lineTo(i*512/n,512);x.moveTo(0,i*512/n);x.lineTo(512,i*512/n);x.stroke()}}function paint(e){const r=c.getBoundingClientRect(),px=Math.floor((e.clientX-r.left)/r.width*n),py=Math.floor((e.clientY-r.top)/r.height*n),s=512/n;x.fillStyle=erase?'#fff':document.querySelector('#colour').value;x.fillRect(px*s,py*s,s,s)}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);paint(e)};c.onpointermove=e=>down&&paint(e);c.onpointerup=c.onpointercancel=()=>down=false;document.querySelector('#grid').onchange=e=>{n=+e.target.value;blank()};document.querySelector('#eraser').onclick=()=>erase=!erase;document.querySelector('#clear').onclick=blank;document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.download='gridless-pixel-art.png';a.href=c.toDataURL();a.click()};blank();</script></body></html>
