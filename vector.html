<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridLess Vector Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eee;font:14px system-ui}header{height:58px;background:#1b1e28;border-bottom:1px solid #343846;display:flex;align-items:center;gap:16px;padding:0 18px}a{color:#b9a5ff;text-decoration:none}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 58px)}aside{padding:17px;background:#191c25;border-right:1px solid #343846}main{padding:22px;display:grid;place-items:center;min-width:0}button,input{font:inherit;color:inherit;background:#272c39;border:1px solid #414657;border-radius:8px;padding:9px}button{cursor:pointer;width:100%;margin:4px 0}button:hover{border-color:#a78bfa}label{display:block;color:#aeb4c5;font-size:12px;margin:12px 0 4px}input{width:100%}#art{width:min(100%,1000px);height:auto;aspect-ratio:4/3;background:white;box-shadow:0 12px 40px #0008;touch-action:none}.row{display:flex;gap:7px}.row>*{flex:1}.hint{color:#9ba2b5;font-size:12px;line-height:1.6}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid #343846}.tools{display:grid;grid-template-columns:repeat(3,1fr)}main{padding:10px}}</style></head><body><header><a href="index.html">← GridLess</a><b>✳ GridLess Vector Lab</b><span style="color:#9ba2b5">SVG designer</span></header><div class="layout"><aside><div class="tools"><button id="rect">＋ Rectangle</button><button id="circle">＋ Circle</button><button id="line">＋ Line</button><button id="text">＋ Text</button><button id="star">＋ Star</button><button id="delete">Delete selected</button></div><label>Fill colour</label><input id="fill" type="color" value="#8b70df"><label>Stroke colour</label><input id="stroke" type="color" value="#27223a"><label>Stroke width</label><input id="width" type="range" min="0" max="24" value="2"><div class="row"><button id="front">Bring front</button><button id="back">Send back</button></div><button id="download" style="background:#8b70df;color:#171321;font-weight:700">Download SVG</button><p class="hint">Click an item to select it. Drag to move it. Style the selected shape. Your artwork is editable SVG.</p></aside><main><svg id="art" viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="750" fill="#fff" id="paper"/></svg></main></div><script>const svg=document.querySelector('#art'),ns='http://www.w3.org/2000/svg';let chosen=null,drag=null,offset={x:0,y:0};function add(tag,attrs){const el=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));el.setAttribute('fill',document.querySelector('#fill').value);el.setAttribute('stroke',document.querySelector('#stroke').value);el.setAttribute('stroke-width',document.querySelector('#width').value);el.style.cursor='move';svg.append(el);select(el);return el}function select(el){if(chosen)chosen.removeAttribute('data-selected');chosen=el;if(el)el.setAttribute('data-selected','1')}function xy(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}document.querySelector('#rect').onclick=()=>add('rect',{x:330,y:260,width:300,height:190,rx:18});document.querySelector('#circle').onclick=()=>add('circle',{cx:500,cy:375,r:110});document.querySelector('#line').onclick=()=>add('line',{x1:250,y1:375,x2:750,y2:375,fill:'none'});document.querySelector('#star').onclick=()=>{let pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?65:145;pts.push(500+Math.cos(a)*r,375+Math.sin(a)*r)}add('polygon',{points:pts.join(',')})};document.querySelector('#text').onclick=()=>{const t=prompt('Text to add','Your design');if(t){const e=add('text',{x:300,y:390,'font-size':72,'font-family':'Arial','font-weight':'bold',stroke:'none'});e.textContent=t}};svg.addEventListener('pointerdown',e=>{if(e.target===svg||e.target.id==='paper'){select(null);return}if(e.target!==svg){select(e.target);const p=xy(e),tag=chosen.tagName;drag=chosen;offset={x:p.x-(+(chosen.getAttribute(tag==='circle'?'cx':'x')||0)),y:p.y-(+(chosen.getAttribute(tag==='circle'?'cy':'y')||0))};svg.setPointerCapture(e.pointerId)}});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=xy(e),tag=drag.tagName;if(tag==='circle'){drag.setAttribute('cx',p.x-offset.x);drag.setAttribute('cy',p.y-offset.y)}else if(tag==='line'){const dx=p.x-offset.x-(+drag.getAttribute('x1')),dy=p.y-offset.y-(+drag.getAttribute('y1'));['x1','x2'].forEach(k=>drag.setAttribute(k,+drag.getAttribute(k)+dx));['y1','y2'].forEach(k=>drag.setAttribute(k,+drag.getAttribute(k)+dy));offset={x:p.x-(+drag.getAttribute('x1')),y:p.y-(+drag.getAttribute('y1'))}}else if(tag!=='polygon'){drag.setAttribute('x',p.x-offset.x);drag.setAttribute('y',p.y-offset.y)}});svg.addEventListener('pointerup',()=>drag=null);document.querySelector('#fill').oninput=e=>chosen&&chosen.setAttribute('fill',e.target.value);document.querySelector('#stroke').oninput=e=>chosen&&chosen.setAttribute('stroke',e.target.value);document.querySelector('#width').oninput=e=>chosen&&chosen.setAttribute('stroke-width',e.target.value);document.querySelector('#delete').onclick=()=>{if(chosen&&chosen.id!=='paper'){chosen.remove();chosen=null}};document.querySelector('#front').onclick=()=>chosen&&svg.append(chosen);document.querySelector('#back').onclick=()=>chosen&&svg.insertBefore(chosen,svg.children[1]||null);document.querySelector('#download').onclick=()=>{const clone=svg.cloneNode(true);clone.querySelectorAll('[data-selected]').forEach(x=>x.removeAttribute('data-selected'));const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gridless-art.svg';a.click();URL.revokeObjectURL(a.href)};</script></body></html>
