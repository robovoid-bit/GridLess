<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridLess Beat Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eee;font:14px system-ui}header{height:58px;background:#1b1e28;border-bottom:1px solid #343846;display:flex;align-items:center;gap:16px;padding:0 18px}a{color:#b9a5ff;text-decoration:none}main{max-width:1050px;margin:35px auto;padding:0 20px}.panel{background:#1b1e28;border:1px solid #343846;border-radius:15px;padding:20px;margin:16px 0}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,input{font:inherit;color:inherit;background:#272c39;border:1px solid #414657;border-radius:8px;padding:9px}button{cursor:pointer}button:hover{border-color:#a78bfa}.primary{background:#8b70df;color:#171321;font-weight:700}.track{display:grid;grid-template-columns:90px repeat(16,1fr);gap:5px;align-items:center;margin:12px 0}.step{padding:0;height:33px;background:#282d3a;border:1px solid #3e4557;border-radius:5px}.step.on{background:#a78bfa;border-color:#d4c7ff}.trackname{font-weight:700;color:#c8c1dd}.muted{color:#9ba2b5;font-size:12px}input[type=range]{accent-color:#a78bfa}#bpm{width:80px}@media(max-width:650px){.track{grid-template-columns:65px repeat(16,minmax(12px,1fr));gap:3px}.step{height:27px}.trackname{font-size:11px}}</style></head><body><header><a href="index.html">← GridLess</a><b>♫ GridLess Beat Lab</b><span class="muted">Step sequencer</span></header><main><h1>Make a beat.</h1><p class="muted">Create drum patterns and melodies with your browser's audio engine.</p><section class="panel"><div class="top"><button class="primary" id="play">▶ Play</button><button id="clear">Clear pattern</button><button id="random">Random beat</button><label>BPM <input id="bpm" type="number" min="50" max="200" value="110"></label><label>Master <input id="volume" type="range" min="0" max="100" value="65"></label><span class="muted" id="status">Stopped</span></div><div id="sequencer"></div></section><section class="panel"><h3>How to use</h3><p class="muted">Tap squares to switch notes on and off. Press Play to hear your loop. Change tempo while experimenting. Sound is generated live on your device.</p></section></main><script>const names=['Kick','Snare','Hi-hat','Bass','Tone'],patterns=names.map(()=>Array(16).fill(false));[0,4,8,12].forEach(i=>patterns[0][i]=true);[4,12].forEach(i=>patterns[1][i]=true);for(let i=0;i<16;i+=2)patterns[2][i]=true;[0,3,7,10,14].forEach(i=>patterns[3][i]=true);let ctx=null,timer=null,step=0,next=0,active=false;const seq=document.querySelector('#sequencer');function draw(){seq.innerHTML='';names.forEach((n,r)=>{const row=document.createElement('div');row.className='track';const label=document.createElement('span');label.className='trackname';label.textContent=n;row.append(label);patterns[r].forEach((v,i)=>{const b=document.createElement('button');b.className='step'+(v?' on':'');b.title=n+' step '+(i+1);b.onclick=()=>{patterns[r][i]=!patterns[r][i];b.classList.toggle('on',patterns[r][i])};row.append(b)});seq.append(row)})}draw();function sound(r,time){const vol=+document.querySelector('#volume').value/100;if(!ctx||!vol)return;const g=ctx.createGain();g.gain.setValueAtTime(vol*.28,time);g.gain.exponentialRampToValueAtTime(.001,time+.18);g.connect(ctx.destination);if(r===0){const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(130,time);o.frequency.exponentialRampToValueAtTime(42,time+.14);o.connect(g);o.start(time);o.stop(time+.16)}else if(r===1||r===2){const n=Math.floor(ctx.sampleRate*(r===1?.16:.05)),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=buf;s.connect(g);s.start(time)}else{const o=ctx.createOscillator();o.type=r===3?'triangle':'sine';o.frequency.value=(r===3?[110,130,146,164,196,220,246,261][step%8]:[261,293,329,392,440,392,329,293][step%8]);o.connect(g);o.start(time);o.stop(time+.13)}}function tick(){const bpm=Math.max(50,Math.min(200,+document.querySelector('#bpm').value||110)),interval=60/bpm/4;while(next<ctx.currentTime+.12){patterns.forEach((p,r)=>{if(p[step])sound(r,next)});const col=step;document.querySelectorAll('.track').forEach(row=>row.querySelectorAll('.step').forEach((b,i)=>b.style.outline=i===col?'2px solid #67e8f9':'none'));step=(step+1)%16;next+=interval}}async function start(){if(active)return;ctx=ctx||new AudioContext();await ctx.resume();active=true;step=0;next=ctx.currentTime+.04;timer=setInterval(tick,25);document.querySelector('#play').textContent='■ Stop';document.querySelector('#status').textContent='Playing'}function stop(){active=false;clearInterval(timer);document.querySelector('#play').textContent='▶ Play';document.querySelector('#status').textContent='Stopped';document.querySelectorAll('.step').forEach(b=>b.style.outline='none')}document.querySelector('#play').onclick=()=>active?stop():start();document.querySelector('#clear').onclick=()=>{stop();patterns.forEach(p=>p.fill(false));draw()};document.querySelector('#random').onclick=()=>{stop();patterns.forEach((p,r)=>p.forEach((_,i)=>p[i]=Math.random()<(r===2?.65:.22)));draw()};window.onpagehide=()=>{stop();ctx&&ctx.close()};</script></body></html>
