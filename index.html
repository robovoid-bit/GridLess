<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridless</title>
<link rel="shortcut icon" href="https://static.vecteezy.com/system/resources/thumbnails/068/082/380/small/artificial-intelligence-design-png.png" sizes="152x152">
<style>
:root{--acc:#3b82f6;--top:32px;--dock:84px;--w:rgba(255,255,255,.76);--panel:#fff;--bg:#f4f5f8;--line:rgba(0,0,0,.1);--text:#1c1f26;--mute:#6b7280}
body.dark{--w:rgba(30,30,36,.78);--panel:#2a2a31;--bg:#1d1d22;--line:rgba(255,255,255,.13);--text:#f2f2f5;--mute:#a0a6b2}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px}
button:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;user-select:text;-webkit-user-select:text}
.drag iframe{pointer-events:none}
.tile{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;font-size:26px;line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px rgba(0,0,0,.28);flex:none}
.tile.sm{width:20px;height:20px;border-radius:6px;font-size:12px;box-shadow:none}
/* top toolbar */
#top{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--w);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;z-index:9997;font-size:13px}
#top b{font-weight:700;letter-spacing:.04em;flex:1}
#top button{background:none;border-color:transparent;padding:2px 8px;border-radius:8px;height:24px}
#top button:hover{background:rgba(127,127,127,.2)}
#clock{padding:0 6px;white-space:nowrap}
/* desktop icons (right side) */
#desk{position:fixed;top:calc(var(--top) + 12px);right:12px;bottom:var(--dock);direction:rtl;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,102px);grid-auto-columns:96px;align-content:start;gap:2px}
.ico{direction:ltr;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:1px solid transparent;border-radius:12px;padding:6px 2px;height:100px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.ico b{font-weight:500;font-size:12px;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ico:hover,.ico.sel{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
/* windows */
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.win{position:fixed;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.22);overflow:hidden;min-width:300px;min-height:200px;animation:pop .16s ease-out}
.win.active{box-shadow:0 18px 60px rgba(0,0,0,.4)}
.win.max{left:0!important;top:var(--top)!important;width:100%!important;height:calc(100% - var(--top) - var(--dock))!important;border-radius:0;border-left:0;border-right:0}
.tb{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--w);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
.tb .t{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:7px}
.ctl button{width:14px;height:14px;padding:0;border-radius:50%;border:0;font-size:9px;line-height:14px;color:transparent}
.ctl:hover button{color:rgba(0,0,0,.6)}
.ctl .m{background:#febc2e}.ctl .z{background:#28c840}.ctl .x{background:#ff5f57}
.wbody{flex:1;position:relative;min-height:0;display:flex;flex-direction:column;user-select:text;-webkit-user-select:text}
.wbody iframe{flex:1;border:0;width:100%;background:var(--bg)}
.win:not(.active) .wbody::after{content:"";position:absolute;inset:0;z-index:2}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:3;touch-action:none}
.win.max .rs{display:none}
.pad{padding:18px;overflow:auto;gap:8px;background:var(--panel)}
.pad h3{margin:16px 0 4px;font-size:15px}.pad h3:first-child{margin-top:0}
.f{display:flex;gap:8px;flex-wrap:wrap}.f input{flex:1;min-width:90px}
.hint{color:var(--mute);font-size:12px;margin:4px 0}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:60px;height:38px;padding:0;border-radius:10px}
.ci{display:flex;align-items:center;gap:8px;padding:4px 0}.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes{flex:1;resize:none;border:0;background:var(--panel);padding:16px;outline:0;line-height:1.65}
.tool{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:var(--bg)}.tool input{flex:1;background:var(--panel)}
/* dock */
#dock{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);display:flex;align-items:flex-end;gap:8px;padding:8px 10px 10px;background:var(--w);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.25);z-index:9999}
.dk{position:relative;padding:0;border:0;background:none;border-radius:14px;transition:transform .14s}
.dk:hover{transform:translateY(-7px) scale(1.14)}
.dk::before{content:attr(data-n);position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:rgba(20,20,24,.9);color:#fff;font-size:12px;padding:3px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.dk:hover::before{opacity:1}
.dk::after{content:"";position:absolute;bottom:-7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--text);opacity:0}
.dk.run::after{opacity:.7}.dk.on::after{opacity:1;background:var(--acc)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
/* launcher + context menu */
#launch{position:fixed;left:50%;bottom:calc(var(--dock) + 8px);transform:translateX(-50%);width:min(540px,calc(100% - 16px));max-height:62%;background:var(--w);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:22px;padding:14px;z-index:9998;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
#launch[hidden],#ctx[hidden]{display:none}
#lgrid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
#lgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border-color:transparent;padding:10px 4px;font-size:12px;text-align:center}
#lgrid button:hover{background:rgba(127,127,127,.18)}
#ctx{position:fixed;z-index:10000;min-width:180px;background:var(--w);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#ctx button{display:block;width:100%;text-align:left;background:none;border-color:transparent;border-radius:8px}
#ctx button:hover{background:var(--acc);color:#fff}
@media(max-width:700px){:root{--dock:74px}.tile{width:44px;height:44px;font-size:22px}#dock{gap:6px;overflow-x:auto}.dk:hover{transform:none}.dk::before{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="top"><b>◆ GRIDLESS</b><span id="clock"></span><button id="bFs" title="Fullscreen" aria-label="Fullscreen">⛶</button><button id="bTheme" title="Light or dark mode" aria-label="Toggle dark mode">◐</button></div>
<div id="desk" aria-label="Desktop"></div>
<div id="launch" hidden><input id="q" placeholder="Search apps…" aria-label="Search apps"><div id="lgrid"></div></div>
<div id="dock" aria-label="Dock"></div>
<div id="ctx" hidden></div>

<script>
/* ============================================================
   APP LIST. Add or edit your apps here.
   - url:     a page in this repo (e.g. "builder.html") or any web address
   - builtin: one of the built-in apps defined further down
   - w, h:    starting window size      - hue: icon colour (0 to 360)
   You can also add apps without editing code in Settings.
   ============================================================ */
const APPS=[
  {id:"builder", name:"AI Web Builder", icon:"🛠️", hue:215, url:"builder.html", w:1060, h:660},
  {id:"chat",    name:"Chat Bot",       icon:"💬", hue:150, url:"builder.html?mode=chat", w:480, h:640},
  {id:"browser", name:"Browser",        icon:"🌐", hue:190, builtin:"browser", w:900, h:600},
  {id:"notes",   name:"Notes",          icon:"📝", hue:42,  builtin:"notes", w:440, h:460},
  {id:"settings",name:"Settings",       icon:"⚙️", hue:265, builtin:"settings", w:560, h:600},
];
/* ============================================================ */

const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const K="gridless.desktop.v1";
let S={wall:0,wallUrl:"",acc:"#3b82f6",dark:false,custom:[],notes:""};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}
if(S.acc==="#d08a5e")S.acc="#3b82f6";
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const all=()=>[...APPS,...S.custom];
const hue=a=>a.hue!=null?a.hue:[...a.name].reduce((x,c)=>x+c.charCodeAt(0),0)*37%360;
function tile(a,cls){const t=h("span","tile"+(cls?" "+cls:""),a.icon||"📦"),H=hue(a);t.style.background=`linear-gradient(145deg,hsl(${H} 80% 64%),hsl(${(H+38)%360} 72% 46%))`;return t}
const WALLS=[
 "radial-gradient(900px 600px at 12% 8%,rgba(124,92,255,.7),transparent),radial-gradient(800px 600px at 90% 15%,rgba(255,122,182,.6),transparent),radial-gradient(1000px 700px at 55% 105%,rgba(255,179,102,.7),transparent),linear-gradient(160deg,#2b6bff,#6a3df0 55%,#c04bd6)",
 "linear-gradient(160deg,#0f2027,#203a43 50%,#2c5364)",
 "radial-gradient(900px 700px at 80% 0%,rgba(255,210,120,.8),transparent),linear-gradient(170deg,#ff6b6b,#c44569 55%,#574b90)",
 "radial-gradient(800px 600px at 20% 100%,rgba(80,220,170,.6),transparent),linear-gradient(160deg,#134e5e,#71b280)",
 "radial-gradient(circle at 30% 20%,#5b4b9a,#14121f 70%)",
 "linear-gradient(160deg,#e0eafc,#cfdef3 50%,#a1c4fd)"];
function theme(){
  document.documentElement.style.setProperty("--acc",S.acc);
  document.body.classList.toggle("dark",!!S.dark);
  document.body.style.background=S.wallUrl?'center/cover no-repeat url("'+S.wallUrl.replace(/["\\)]/g,"")+'")':(WALLS[S.wall]||WALLS[0]);
}
const toggleDark=()=>{S.dark=!S.dark;save();theme()};
const fs=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
$("bTheme").onclick=toggleDark;$("bFs").onclick=fs;

/* ---------- desktop, dock, launcher ---------- */
let lastTap={id:"",t:0};
function drawAll(){
  const d=$("desk");d.innerHTML="";
  all().forEach(a=>{
    const b=h("button","ico");b.append(tile(a),h("b",0,a.name));
    b.onclick=()=>{d.querySelectorAll(".ico").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");const n=Date.now();if(lastTap.id===a.id&&n-lastTap.t<450){openApp(a);lastTap={id:"",t:0}}else lastTap={id:a.id,t:n}};
    b.onkeydown=e=>{if(e.key==="Enter")openApp(a)};d.append(b);
  });
  const k=$("dock");k.innerHTML="";
  const lb=h("button","dk");lb.dataset.n="Apps";lb.setAttribute("aria-label","All apps");
  const lt=h("span","tile","⠿");lt.style.background="linear-gradient(145deg,#ffffff,#d9dde6)";lt.style.color="#333";lb.append(lt);
  lb.onclick=e=>{e.stopPropagation();const l=$("launch");l.hidden=!l.hidden;if(!l.hidden){$("q").value="";drawLaunch("");$("q").focus()}};
  k.append(lb,h("div","sep"));
  all().forEach(a=>{const b=h("button","dk");b.dataset.n=a.name;b.dataset.id=a.id;b.setAttribute("aria-label",a.name);b.append(tile(a));
    b.onclick=()=>{const o=wins.get(a.id);if(!o)openApp(a);else if(o.el.hidden){o.el.hidden=false;focusWin(o)}else if(activeId===a.id)minWin(o);else focusWin(o)};k.append(b)});
  updateRun();drawLaunch($("q").value);
}
function updateRun(){document.querySelectorAll(".dk[data-id]").forEach(b=>{const o=wins.get(b.dataset.id);b.classList.toggle("run",!!o);b.classList.toggle("on",!!o&&!o.el.hidden&&activeId===b.dataset.id)})}
function drawLaunch(f){
  const L=$("lgrid");L.innerHTML="";f=(f||"").toLowerCase();
  all().filter(a=>a.name.toLowerCase().includes(f)).forEach(a=>{const b=h("button");b.append(tile(a),h("span",0,a.name));b.onclick=()=>{$("launch").hidden=true;openApp(a)};L.append(b)});
}
$("q").oninput=()=>drawLaunch($("q").value);
$("q").onkeydown=e=>{if(e.key==="Enter"){const b=$("lgrid").querySelector("button");if(b)b.click()}if(e.key==="Escape")$("launch").hidden=true};
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#launch,#dock"))$("launch").hidden=true;if(!e.target.closest("#ctx"))$("ctx").hidden=true});
document.addEventListener("contextmenu",e=>{
  if(e.target.closest(".win,#dock,#top,#launch"))return;e.preventDefault();
  const c=$("ctx");c.innerHTML="";
  [["Open Settings",()=>{const a=APPS.find(x=>x.id==="settings");if(a)openApp(a)}],["Next wallpaper",()=>{S.wall=(S.wall+1)%WALLS.length;S.wallUrl="";save();theme()}],["Light or dark mode",toggleDark],["Fullscreen",fs]].forEach(([n,f])=>{const b=h("button",0,n);b.onclick=()=>{c.hidden=true;f()};c.append(b)});
  c.style.left=Math.min(e.clientX,innerWidth-200)+"px";c.style.top=Math.min(e.clientY,innerHeight-190)+"px";c.hidden=false;
});

/* ---------- window manager ---------- */
const wins=new Map();let z=10,activeId="";
function focusWin(o){wins.forEach(x=>x.el.classList.remove("active"));o.el.classList.add("active");o.el.style.zIndex=++z;activeId=o.app.id;updateRun()}
function minWin(o){o.el.hidden=true;activeId="";updateRun()}
function closeWin(o){o.el.remove();wins.delete(o.app.id);if(activeId===o.app.id)activeId="";updateRun()}
function openApp(app){
  const ex=wins.get(app.id);if(ex){ex.el.hidden=false;focusWin(ex);return}
  const w=h("div","win"),o={app,el:w},n=wins.size;
  const W=Math.min(app.w||800,innerWidth-20),H=Math.min(app.h||560,innerHeight-130);
  w.style.cssText=`left:${Math.max(8,Math.min(70+n*30,innerWidth-W-8))}px;top:${Math.max(44,50+n*28)}px;width:${W}px;height:${H}px`;
  const tb=h("div","tb"),t=h("div","t"),ctl=h("div","ctl");
  t.append(tile(app,"sm"),h("span",0,app.name));
  const bm=h("button","m","–"),bz=h("button","z","+"),bc=h("button","x","×");
  bm.title="Minimise";bz.title="Maximise";bc.title="Close";[bm,bz,bc].forEach(b=>b.setAttribute("aria-label",b.title));
  ctl.append(bm,bz,bc);tb.append(t,ctl);
  const body=h("div","wbody"),rs=h("div","rs");w.append(tb,body,rs);document.body.append(w);wins.set(app.id,o);
  if(app.builtin&&BUILTIN[app.builtin])BUILTIN[app.builtin](body);
  else{const f=document.createElement("iframe");f.title=app.name;f.allow="webgpu; clipboard-write; clipboard-read; fullscreen";f.src=app.url;body.append(f)}
  bm.onclick=()=>minWin(o);bc.onclick=()=>closeWin(o);
  const mx=()=>w.classList.toggle("max");bz.onclick=mx;tb.ondblclick=e=>{if(!e.target.closest("button"))mx()};
  w.addEventListener("pointerdown",()=>{if(activeId!==app.id)focusWin(o)},true);
  drag(tb,e=>w.classList.contains("max")?null:{x:e.clientX-w.offsetLeft,y:e.clientY-w.offsetTop},(e,s)=>{
    w.style.left=Math.min(Math.max(e.clientX-s.x,80-w.offsetWidth),innerWidth-80)+"px";
    w.style.top=Math.min(Math.max(e.clientY-s.y,32),innerHeight-100)+"px"});
  drag(rs,e=>({x:w.offsetWidth-e.clientX,y:w.offsetHeight-e.clientY}),(e,s)=>{
    w.style.width=Math.max(300,e.clientX+s.x)+"px";w.style.height=Math.max(200,e.clientY+s.y)+"px"});
  if(innerWidth<760)w.classList.add("max");
  focusWin(o);
}
function drag(el,start,move){
  el.addEventListener("pointerdown",e=>{
    if(e.target.closest("button")||e.button>0)return;
    const s=start(e);if(!s)return;
    el.setPointerCapture(e.pointerId);document.body.classList.add("drag");
    const mv=ev=>move(ev,s);
    const up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);document.body.classList.remove("drag")};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  });
}

/* ---------- built-in apps ---------- */
const BUILTIN={
  notes(b){
    const t=h("textarea","notes");t.value=S.notes;t.placeholder="Write anything. It saves automatically in this browser.";t.setAttribute("aria-label","Notes");
    t.oninput=()=>{S.notes=t.value;save()};b.append(t);
  },
  browser(b){
    const bar=h("div","tool"),inp=h("input"),go=h("button",0,"Go"),ext=h("button",0,"↗"),f=document.createElement("iframe");
    inp.placeholder="Enter a web address, e.g. wikipedia.org";inp.setAttribute("aria-label","Web address");ext.title="Open in a new tab";ext.setAttribute("aria-label","Open in a new tab");
    const url=()=>{let u=inp.value.trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;inp.value=u;return u};
    go.onclick=()=>{const u=url();if(u)f.src=u};ext.onclick=()=>{const u=url();if(u)window.open(u,"_blank","noopener")};
    inp.onkeydown=e=>{if(e.key==="Enter")go.click()};
    f.title="Browser page";f.srcdoc='<body style="font:15px system-ui;padding:32px;color:#444;background:#fff"><h2>Browser</h2><p>Type an address above and press Go.</p><p>Many sites (Google, YouTube, GitHub and others) refuse to load inside another page. If a page stays blank, press the arrow button to open it in a new tab.</p></body>';
    bar.append(inp,go,ext);b.append(bar,f);
  },
  settings(b){
    b.classList.add("pad");
    b.innerHTML='<h3>Appearance</h3><div class="f"><button class="dm"></button></div><h3>Wallpaper</h3><div class="sw"></div><div class="f"><input class="wu" placeholder="Or paste an image address (https://…)" aria-label="Wallpaper image address"><button class="wa">Use image</button></div>'+
      '<h3>Accent colour</h3><input type="color" class="ac" aria-label="Accent colour" style="width:64px;height:36px;padding:2px">'+
      '<h3>Your apps</h3><div class="cl"></div><div class="f"><input class="an" placeholder="Name" aria-label="App name"><input class="ai" placeholder="Emoji" maxlength="4" style="max-width:72px;flex:none" aria-label="App emoji"><input class="au" placeholder="https://… or page.html" aria-label="App address"><button class="aa primary">Add</button></div>'+
      '<p class="hint">Custom apps open any web address or page in this site. Sites that block embedding will show blank.</p>'+
      '<h3>Desktop</h3><button class="rst">Reset desktop</button><p class="hint">To add apps for good, edit the APPS list at the top of index.html.</p>';
    const q=s=>b.querySelector(s),sw=q(".sw"),dm=q(".dm");
    const lab=()=>dm.textContent=S.dark?"Switch to light mode":"Switch to dark mode";lab();dm.onclick=()=>{toggleDark();lab()};
    WALLS.forEach((g,i)=>{const x=h("button");x.style.background=g;x.title="Wallpaper "+(i+1);x.setAttribute("aria-label",x.title);x.onclick=()=>{S.wall=i;S.wallUrl="";save();theme()};sw.append(x)});
    q(".wa").onclick=()=>{const u=q(".wu").value.trim();if(/^https?:\/\//i.test(u)){S.wallUrl=u;save();theme()}};
    q(".ac").value=S.acc;q(".ac").oninput=e=>{S.acc=e.target.value;save();theme()};
    const list=()=>{
      const L=q(".cl");L.innerHTML="";
      if(!S.custom.length)L.append(h("p","hint","No custom apps yet."));
      S.custom.forEach(a=>{const r=h("div","ci"),x=h("button",0,"Remove");r.append(h("span",0,(a.icon||"📦")+"  "+a.name+"  ("+a.url+")"),x);
        x.onclick=()=>{S.custom=S.custom.filter(k=>k.id!==a.id);save();const o=wins.get(a.id);if(o)closeWin(o);drawAll();list()};L.append(r)});
    };
    q(".aa").onclick=()=>{
      const name=q(".an").value.trim(),url=q(".au").value.trim();
      if(!name||!/^(https?:\/\/\S+|[\w./~-]+(\?\S*)?)$/i.test(url))return alert("Enter a name and an address that starts with https:// or is a page name like page.html");
      S.custom.push({id:"c"+Date.now(),name,icon:q(".ai").value.trim()||"📦",url,w:900,h:600});save();drawAll();list();
      q(".an").value=q(".ai").value=q(".au").value="";
    };
    q(".rst").onclick=()=>{if(confirm("Reset wallpaper, colour, theme and custom apps? Your notes stay.")){S.wall=0;S.wallUrl="";S.acc="#3b82f6";S.dark=false;S.custom=[];save();theme();drawAll();list();q(".ac").value=S.acc;lab()}};
    list();
  }
};

/* ---------- clock + start ---------- */
function tick(){const d=new Date();$("clock").textContent=d.toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"})+"  "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
tick();setInterval(tick,15000);
theme();drawAll();
</script>
