<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridLess 3D Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eee;font:14px system-ui}header{height:58px;padding:0 18px;display:flex;align-items:center;gap:18px;background:#1b1e28;border-bottom:1px solid #343846}a{color:#b9a5ff;text-decoration:none}main{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 58px)}aside{padding:17px;background:#191c25;border-right:1px solid #343846}h3{font-size:13px;color:#b8bfd0;text-transform:uppercase;letter-spacing:1px;margin:8px 0}button,select,input{font:inherit;color:inherit;background:#272c39;border:1px solid #414657;border-radius:8px;padding:9px}button{cursor:pointer}button:hover{border-color:#a78bfa}.row{display:flex;gap:7px;margin:8px 0}.row button{flex:1}.full{width:100%;margin:4px 0}.scene{min-height:calc(100vh - 58px);position:relative}#view{display:block;width:100%;height:100%;min-height:calc(100vh - 58px)}.note{font-size:12px;color:#9ba2b5;line-height:1.6}#objects{font-size:12px;color:#b8bfd0;line-height:1.8}@media(max-width:700px){main{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid #343846}.scene,#view{min-height:65vh}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><header><a href="index.html">← GridLess</a><b>◇ GridLess 3D Studio</b><span style="color:#9ba2b5">Scene builder</span></header><main><aside><h3>Add object</h3><button class="full" id="cube">＋ Cube</button><button class="full" id="sphere">＋ Sphere</button><button class="full" id="torus">＋ Torus</button><button class="full" id="cone">＋ Cone</button><h3>Selected object</h3><select class="full" id="select"></select><label>Object colour</label><input type="color" id="colour" value="#8b70df" style="width:100%;height:40px"><div class="row"><button id="up">Up</button><button id="down">Down</button></div><div class="row"><button id="left">←</button><button id="right">→</button></div><div class="row"><button id="bigger">Scale +</button><button id="smaller">Scale −</button></div><button class="full" id="rotate">Rotate 15°</button><button class="full" id="delete">Delete object</button><h3>Scene</h3><button class="full" id="reset">Reset scene</button><button class="full" id="export">Export scene JSON</button><p class="note">Drag to orbit. Scroll to zoom. Use the controls to arrange objects. Export saves editable scene data as JSON.</p><div id="objects"></div></aside><section class="scene"><canvas id="view"></canvas></section></main>
<script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);const scene=new THREE.Scene();scene.background=new THREE.Color('#171a24');const camera=new THREE.PerspectiveCamera(50,canvas.clientWidth/canvas.clientHeight,.1,100);camera.position.set(7,6,9);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xcbdcff,0x363047,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(5,9,5);scene.add(light);const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:'#242936',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;scene.add(floor);scene.add(new THREE.GridHelper(40,40,'#55516d','#34394a'));let objects=[],selected=null;function add(type){const g=type==='Cube'?new THREE.BoxGeometry(1.5,1.5,1.5):type==='Sphere'?new THREE.SphereGeometry(.9,32,20):type==='Torus'?new THREE.TorusGeometry(.8,.3,16,80):new THREE.ConeGeometry(.9,1.8,32);const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:document.querySelector('#colour').value,roughness:.42,metalness:.12}));m.position.set((objects.length%3-1)*2,1,Math.floor(objects.length/3)*-2);m.userData.label=type+' '+(objects.length+1);scene.add(m);objects.push(m);choose(m);refresh()}function choose(m){selected=m;document.querySelector('#select').value=String(objects.indexOf(m));if(m)document.querySelector('#colour').value='#'+m.material.color.getHexString()}function refresh(){const s=document.querySelector('#select');s.innerHTML='';objects.forEach((o,i)=>{const op=document.createElement('option');op.value=i;op.textContent=o.userData.label;s.append(op)});if(selected)s.value=objects.indexOf(selected);document.querySelector('#objects').textContent=objects.length+' object(s) in scene'}[['cube','Cube'],['sphere','Sphere'],['torus','Torus'],['cone','Cone']].forEach(([id,t])=>document.querySelector('#'+id).onclick=()=>add(t));document.querySelector('#select').onchange=e=>choose(objects[+e.target.value]);document.querySelector('#colour').oninput=e=>{if(selected)selected.material.color.set(e.target.value)};const move=(x,y,z)=>{if(selected)selected.position.add(new THREE.Vector3(x,y,z))};document.querySelector('#up').onclick=()=>move(0,.5,0);document.querySelector('#down').onclick=()=>move(0,-.5,0);document.querySelector('#left').onclick=()=>move(-.5,0,0);document.querySelector('#right').onclick=()=>move(.5,0,0);document.querySelector('#bigger').onclick=()=>selected&&selected.scale.multiplyScalar(1.15);document.querySelector('#smaller').onclick=()=>selected&&selected.scale.multiplyScalar(.87);document.querySelector('#rotate').onclick=()=>selected&&(selected.rotation.y+=Math.PI/12);document.querySelector('#delete').onclick=()=>{if(!selected)return;scene.remove(selected);objects=objects.filter(x=>x!==selected);selected=null;refresh()};document.querySelector('#reset').onclick=()=>{objects.forEach(o=>scene.remove(o));objects=[];selected=null;refresh()};document.querySelector('#export').onclick=()=>{const data=objects.map(o=>({name:o.userData.label,geometry:o.geometry.type,position:o.position.toArray(),rotation:o.rotation.toArray(),scale:o.scale.toArray(),color:'#'+o.material.color.getHexString()}));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'GridLess 3D Scene',objects:data},null,2)],{type:'application/json'}));a.download='gridless-scene.json';a.click();URL.revokeObjectURL(a.href)};function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(canvas);function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();add('Cube');add('Sphere');</script></body></html>
