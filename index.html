<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Web AI Chatbot</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 85vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #0084ff;
            color: white;
            padding: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f9f9fa;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background: #e4e6eb;
            color: #050505;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #e4e6eb;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ccd0d5;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }
        .chat-input-area input:focus {
            border-color: #0084ff;
        }
        .chat-input-area button {
            background: #0084ff;
            color: white;
            border: none;
            padding: 0 18px;
            margin-left: 8px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }
        .chat-input-area button:hover {
            background: #006dd3;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Zero-Data-Center AI (Offline Local Engine)</div>
    <div class="chat-messages" id="chatWindow">
        <div class="message bot-message">Hello! I am an AI running entirely inside your web browser. Ask me anything, or type something like "I am tired" or "Why is the sky blue"!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Dumb AI Rule-based Processing Engine (Runs instantly on user's local CPU)
    function generateAIResponse(input) {
        const text = input.toLowerCase().trim();
        
        if (text === "") return "Please type something so I can parse your words!";

        // Keyword Trigger Rules Matrix
        if (text.includes("hello") || text.includes("hi ") || text.includes("hey")) {
            return "Greetings human companion! What's on your mind today?";
        }
        if (text.includes("why is the sky blue")) {
            return "Sunlight reaches Earth's atmosphere and is scattered in all directions by all the gases and particles in the air. Blue light is scattered more than the other colors because it travels as shorter, smaller waves!";
        }
        if (text.includes("help") || text.includes("what can you do")) {
            return "I run 100% locally on your machine with no server. You can ask me how I work, share your feelings, or tell me random facts.";
        }
        if (text.includes("how do you work") || text.includes("where is your data center")) {
            return "I have no data center! I am written entirely in simple JavaScript. Your Chromebook's CPU is processing everything right now inside this web page tab for free.";
        }
        
        // Conversational Phrase Transformations (Eliza Style Logic)
        if (text.startsWith("i am ")) {
            const feeling = input.substring(5);
            return `Why do you say that you are ${feeling}? Is it normal for you to feel that way?`;
        }
        if (text.startsWith("i feel ")) {
            const emotion = input.substring(7);
            return `What do you think caused you to feel ${emotion}? Let's dig deeper into that.`;
        }
        if (text.includes("computer") || text.includes("chromebook") || text.includes("machine")) {
            return "Computers are fascinating. Did you know that I am executing on yours right now without a cloud backend?";
        }
        if (text.includes("thank you") || text.includes("thanks")) {
            return "You are very welcome! I don't sleep, so feel free to keep talking.";
        }

        // Broad Fallback Templates array for randomized responses
        const defaultFallbacks = [
            "That is incredibly interesting. Tell me more about that.",
            "I hear you. How does that make you feel overall?",
            "Can you expand on that thought? My local memory buffers are ready.",
            "Interesting perspective. What do you think your next step should be?",
            "As an on-device lightweight program, I am processing that statement. What led you to say that?"
        ];
        
        const randomIndex = Math.floor(Math.random() * defaultFallbacks.length);
        return defaultFallbacks[randomIndex];
    }

    // UI Render Code
    function appendMessage(text, isUser) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        msgDiv.classList.add(isUser ? 'user-message' : 'bot-message');
        msgDiv.textContent = text;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight; // Auto scroll to bottom
    }

    function processChat() {
        const rawInput = userInput.value;
        if (rawInput.trim() === "") return;

        // 1. Post User Text
        appendMessage(rawInput, true);
        userInput.value = "";

        // 2. Simulate short human-like processing delay (500ms) so it feels real
        setTimeout(() => {
            const botReply = generateAIResponse(rawInput);
            appendMessage(botReply, false);
        }, 400);
    }

    // Trigger Listeners
    sendBtn.addEventListener('click', processChat);
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') processChat();
    });
</script>

</body>
</html>
