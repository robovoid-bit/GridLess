<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridLess Markdown Pad</title><style>*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eee;font:14px system-ui}header{height:58px;background:#1b1e28;border-bottom:1px solid #343846;display:flex;align-items:center;gap:16px;padding:0 18px}a{color:#b9a5ff;text-decoration:none}main{padding:20px;max-width:1400px;margin:auto}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{background:#1b1e28;border:1px solid #343846;border-radius:13px;overflow:hidden}.pane h3{font-size:12px;color:#aeb4c5;padding:10px 14px;margin:0;border-bottom:1px solid #343846;text-transform:uppercase;letter-spacing:1px}textarea{width:100%;height:65vh;resize:vertical;background:#151720;color:#e8e5f2;border:0;padding:16px;font:14px/1.7 ui-monospace,monospace;outline:none}.preview{padding:18px;height:65vh;overflow:auto;line-height:1.7}.preview h1,.preview h2,.preview h3{line-height:1.2}.preview code{background:#30303e;padding:2px 5px;border-radius:4px}.preview pre{background:#11131a;padding:12px;overflow:auto}.preview blockquote{border-left:3px solid #a78bfa;padding-left:12px;color:#aaa}.preview a{color:#b9a5ff}.actions{display:flex;gap:8px;margin:0 0 12px}button{background:#272c39;color:#eee;border:1px solid #414657;border-radius:8px;padding:9px 12px;cursor:pointer}@media(max-width:800px){.split{grid-template-columns:1fr}textarea,.preview{height:40vh}}</style></head><body><header><a href="index.html">← GridLess</a><b>M↓ GridLess Markdown Pad</b></header><main><div class="actions"><button id="download">Download .md</button><button id="clear">Clear document</button></div><div class="split"><section class="pane"><h3>Markdown editor</h3><textarea id="src" spellcheck="false"># Welcome to GridLess Notes

Write in **Markdown** and see your preview update as you type.

## Things you can do
- Make lists
- Add **bold** and *italic* text
- Add `inline code`

> A good idea is worth writing down.

```
Your code snippets go here.
```
</textarea></section><section class="pane"><h3>Live preview</h3><article class="preview" id="preview"></article></section></div></main><script>const src=document.querySelector('#src'),preview=document.querySelector('#preview');function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let s=esc(src.value).replace(/\r/g,''),blocks=[];s=s.replace(/```([\s\S]*?)```/g,(m,c)=>{blocks.push('<pre><code>'+c+'</code></pre>');return'@@BLOCK'+(blocks.length-1)+'@@'});s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/`(.*?)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');s=s.split('\n\n').map(p=>/^<(h[1-3]|ul|pre|blockquote|li)/.test(p)||/^@@BLOCK/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('\n');s=s.replace(/@@BLOCK(\d+)@@/g,(_,i)=>blocks[+i]);preview.innerHTML=s}src.oninput=render;document.querySelector('#clear').onclick=()=>{if(confirm('Clear this document?')){src.value='';render()}};document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([src.value],{type:'text/markdown'}));a.download='gridless-notes.md';a.click();URL.revokeObjectURL(a.href)};render();</script></body></html>
