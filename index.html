<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717"><title>GridLess — Photo Editor</title>
<style>
:root{color-scheme:dark;--bg:#171717;--panel:#242424;--panel2:#2c2c2c;--line:#3b3b3b;--muted:#a4a4a4;--text:#f2f2f2;--blue:#079bd0;--blue2:#087eac}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 Inter,Arial,sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}.topbar{height:42px;background:#222;display:flex;align-items:center;padding:0 14px;gap:24px;border-bottom:1px solid #111;position:relative;z-index:4}.menu{height:100%;display:flex;align-items:center;gap:25px}.menu button{border:0;background:none;padding:0;color:#eee}.menu button:hover{color:#65cfff}.file-actions{display:flex;gap:8px;margin-left:8px}.smallbtn{background:#303030;border:1px solid #555;border-radius:5px;padding:6px 11px}.smallbtn:hover{background:#3a3a3a}.subbar{height:48px;background:#262626;border-bottom:1px solid #111;display:flex;align-items:center;gap:10px;padding:0 14px}.home{font-size:21px;border:0;background:none;margin-right:8px}.toolhint{font-weight:600;color:#e6e6e6}.workarea{height:calc(100% - 90px);display:grid;grid-template-columns:86px minmax(0,1fr) 335px;min-height:0}.tools{background:#202020;border-right:1px solid #090909;padding:9px 7px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:42px;gap:3px;align-content:start}.tool{border:1px solid transparent;background:transparent;border-radius:6px;font-size:20px;color:#c9c9c9;display:grid;place-items:center}.tool:hover{background:#343434}.tool.active{background:#3c3c3c;border-color:#555;color:white}.swatches{grid-column:1/-1;height:72px;position:relative;margin:12px 4px}.swatch{position:absolute;width:39px;height:39px;border:2px solid white;border-radius:50%;background:#fff;left:3px;top:0}.swatch.back{background:#111;left:23px;top:20px}.stage{position:relative;overflow:hidden;background:#191919;display:grid;place-items:center;min-width:0}.canvas-wrap{position:relative;box-shadow:0 3px 24px #0008;line-height:0;max-width:94%;max-height:90%;}.canvas-wrap canvas{display:block;max-width:100%;max-height:calc(100vh - 190px);object-fit:contain;touch-action:none}.status{position:absolute;bottom:0;left:0;background:#101010;padding:5px 12px;color:#aaa;font-size:12px}.right{background:#242424;border-left:1px solid #090909;display:flex;flex-direction:column;min-height:0}.panel{border-bottom:1px solid #111}.panelhead{height:40px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #333}.panelbody{padding:10px}.navigator{height:188px}.navpreview{height:95px;background-color:#343434;background-image:linear-gradient(45deg,#444 25%,transparent 25%),linear-gradient(-45deg,#444 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#444 75%),linear-gradient(-45deg,transparent 75%,#444 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;position:relative;border:1px solid #555}.navpreview:after{content:"";position:absolute;inset:12px 18px;border:1px solid #e87545}.zoomrow{display:flex;align-items:center;gap:9px;margin-top:9px;color:#bbb}.zoomrow input{flex:1;min-width:0}.layers{flex:1;min-height:155px}.layerrow{display:flex;align-items:center;gap:9px;background:var(--blue);padding:9px;margin-bottom:5px;font-weight:600}.layerthumb{width:39px;height:27px;border:1px solid #ddd;background:repeating-conic-gradient(#555 0% 25%,#222 0% 50%) 50%/10px 10px}.layerrow button{margin-left:auto;background:none;border:0}.layerbuttons{display:flex;justify-content:flex-end;gap:15px;padding:10px;color:#bbb}.history{height:180px;overflow:auto}.historyitem{padding:7px 12px;border-bottom:1px solid #333;color:#ddd}.historyitem.active{background:var(--blue)}.modalshade{position:fixed;inset:0;background:#0009;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(1430px,96vw);height:min(470px,90vh);background:#262626;border:1px solid #333;border-radius:18px;box-shadow:0 20px 80px #0009;display:flex;flex-direction:column;overflow:hidden}.modalhead{height:46px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #303030;font-weight:700;position:relative}.x{position:absolute;right:16px;top:8px;border:0;background:none;font-size:23px;color:#aaa}.modalcontent{display:grid;grid-template-columns:minmax(0,1fr) 282px;gap:20px;padding:18px 22px;min-height:0;flex:1}.presets{min-width:0;overflow:auto}.tabs{display:flex;gap:27px;margin:0 0 18px;position:sticky;top:0;background:#262626;z-index:1}.tab{border:0;background:none;color:#aaa;padding:8px 10px 12px;font-weight:600;border-bottom:3px solid transparent}.tab.active{color:#fff;border-color:#00a9df}.presetgrid{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:12px}.preset{background:#222;border:1px solid transparent;border-radius:10px;padding:16px 7px 12px;text-align:center;min-height:138px;color:#ddd}.preset:hover,.preset.active{border-color:#00a9df;background:#292929}.preseticon{height:72px;display:grid;place-items:center;font-size:35px;color:#75b9d7}.preset strong{display:block;font-size:13px;margin-top:3px}.preset small{color:#999;font-size:11px}.settings{border-left:1px solid #4a4a4a;padding-left:18px;overflow:auto}.field{margin:0 0 22px}.field label{display:block;font-weight:600;margin-bottom:5px}.field input[type=text],.field input[type=number]{width:100%;background:#252525;border:1px solid #454545;border-radius:5px;color:white;padding:9px}.dimensions{display:grid;grid-template-columns:1fr 66px;gap:7px;align-items:center;margin:8px 0}.dimensions label{margin:0;color:#ddd}.dimensions input{width:100%;background:#252525;border:1px solid #444;border-radius:5px;padding:7px;color:white;text-align:right}.maxnote{font-size:11px;color:#aaa;margin-top:8px}.backgroundtoggle{width:100%;background:#333;border:0;border-radius:6px;padding:10px;text-align:left;margin-top:4px}.modalfoot{display:flex;justify-content:flex-end;gap:12px;padding:0 18px 16px}.cancel,.create{border-radius:30px;padding:9px 27px;border:1px solid #777;background:transparent;min-width:130px}.create{background:#079fd2;border-color:#079fd2;color:white;font-weight:700}.create:hover{background:#08b3eb}.hidden{display:none!important}.dialog{position:fixed;z-index:20;inset:0;background:#0009;display:grid;place-items:center}.dialogbox{background:#292929;border:1px solid #555;border-radius:12px;padding:20px;width:min(360px,90vw)}.dialogbox input{width:100%;padding:9px;background:#181818;border:1px solid #555;color:white;margin:12px 0}.dialogbox .actions{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:900px){.workarea{grid-template-columns:62px 1fr 245px}.tools{padding:5px 3px}.tool{font-size:17px}.modalcontent{grid-template-columns:1fr 230px}.presetgrid{grid-template-columns:repeat(3,minmax(90px,1fr))}.modal{height:90vh}}
@media(max-width:650px){.workarea{grid-template-columns:54px 1fr}.right{display:none}.menu{gap:13px}.topbar{gap:12px}.subbar{padding:0 7px}.toolhint{font-size:12px}.modalcontent{grid-template-columns:1fr;overflow:auto}.settings{border-left:0;border-top:1px solid #444;padding:14px 0 0}.modal{height:94vh}.presetgrid{grid-template-columns:repeat(2,minmax(100px,1fr))}.tabs{gap:7px;flex-wrap:wrap}.tab{padding:7px}}
</style></head><body>
<header class="topbar"><nav class="menu"><button id="fileMenu">File</button><button id="editMenu">Edit</button><button id="imageMenu">Image</button><button id="layerMenu">Layer</button><button id="selectMenu">Select</button><button id="adjustMenu">Adjustment</button><button id="filterMenu">Filter</button><button id="viewMenu">View</button><button id="helpMenu">Help</button></nav></header>
<div class="subbar"><button class="home" id="newDoc" title="New document">⌂</button><button class="smallbtn" id="openBtn">↥ Open image</button><button class="smallbtn" id="saveBtn">⇩ Save</button><button class="smallbtn" id="undoBtn">↶</button><button class="smallbtn" id="redoBtn">↷</button><span class="toolhint" id="hint">Choose a tool to start editing.</span><input id="fileInput" type="file" accept="image/*" hidden></div>
<main class="workarea"><aside class="tools" id="tools">
<button class="tool active" data-tool="move" title="Move">➤</button><button class="tool" data-tool="select" title="Selection">▧</button><button class="tool" data-tool="lasso" title="Lasso">⌕</button><button class="tool" data-tool="magic" title="Magic select">✣</button><button class="tool" data-tool="crop" title="Crop">⌗</button><button class="tool" data-tool="cut" title="Cut">✂</button><button class="tool" data-tool="blur" title="Blur">≋</button><button class="tool" data-tool="heal" title="Heal">▨</button><button class="tool" data-tool="stamp" title="Clone">♟</button><button class="tool" data-tool="smudge" title="Smudge">◉</button><button class="tool" data-tool="fill" title="Fill">◍</button><button class="tool" data-tool="gradient" title="Gradient">◐</button><button class="tool" data-tool="eraser" title="Eraser">▱</button><button class="tool" data-tool="brush" title="Brush">✎</button><button class="tool" data-tool="pencil" title="Pencil">／</button><button class="tool" data-tool="shape" title="Shape">▰</button><button class="tool" data-tool="text" title="Text">T</button><button class="tool" data-tool="eyedropper" title="Eyedropper">⌁</button><button class="tool" data-tool="zoom" title="Zoom">⌕</button><button class="tool" data-tool="hand" title="Hand">✋</button>
<div class="swatches"><input class="swatch" id="color" type="color" value="#ffffff" title="Foreground colour"><div class="swatch back"></div></div>
</aside><section class="stage" id="stage"><div class="canvas-wrap"><canvas id="canvas" width="1920" height="1080"></canvas></div><div class="status" id="status">1920 × 1080 px · 51%</div></section>
<aside class="right"><section class="panel navigator"><div class="panelhead">Navigate <span>−　×</span></div><div class="panelbody"><div class="navpreview"></div><div class="zoomrow"><button id="zoomOut" class="smallbtn">−</button><input id="zoom" type="range" min="10" max="100" value="51"><button id="zoomIn" class="smallbtn">+</button><span id="zoomLabel">51%</span></div></div></section><section class="panel layers"><div class="panelhead">Layers <span>−　×</span></div><div class="panelbody" id="layerList"><div class="layerrow"><span class="layerthumb"></span><span>Layer 1<br><small>Image</small></span><button title="Visible">◉</button></div></div><div class="layerbuttons"><button id="addLayer">⊕ Add layer</button><button id="duplicateLayer">▣</button><button id="deleteLayer">▤</button></div></section><section class="panel history"><div class="panelhead">History <span>−　×</span></div><div id="history"><div class="historyitem">New document</div></div></section></aside></main>
<div class="modalshade" id="newModal"><section class="modal"><div class="modalhead">Create new <button class="x" id="closeModal">×</button></div><div class="modalcontent"><div class="presets"><div class="tabs"><button class="tab active" data-tab="Recommended">Recommended</button><button class="tab" data-tab="Photo">Photo</button><button class="tab" data-tab="Social">Social</button><button class="tab" data-tab="Web">Web</button><button class="tab" data-tab="Print">Print</button><button class="tab" data-tab="Video">Video</button></div><div class="presetgrid" id="presetGrid"></div></div><aside class="settings"><div class="field"><label for="docName">Name</label><input id="docName" type="text" value="Untitled"></div><div class="field"><label>Dimensions</label><div class="dimensions"><label for="width">Width</label><input id="width" type="number" min="1" max="4096" value="1920"></div><div class="dimensions"><label for="height">Height</label><input id="height" type="number" min="1" max="4096" value="1080"></div><div class="maxnote">Max 4096 × 4096 px</div></div><button class="backgroundtoggle" id="bgToggle">›　Background　 <span id="bgState" style="float:right">◯</span></button><div id="bgOptions" class="hidden" style="padding:12px 2px;color:#bbb"><label><input type="radio" name="bg" value="transparent" checked> Transparent</label><br><label><input type="radio" name="bg" value="white"> White</label><br><label><input type="radio" name="bg" value="black"> Black</label></div></aside></div><footer class="modalfoot"><button class="cancel" id="cancelCreate">Cancel</button><button class="create" id="createDoc">Create</button></footer></section></div>
<div class="dialog hidden" id="textDialog"><div class="dialogbox"><strong>Add text</strong><input id="textValue" value="Your text here"><div class="actions"><button class="smallbtn" id="textCancel">Cancel</button><button class="create" id="textAdd">Add text</button></div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let tool='move',drawing=false,last=null,zoom=51,undoStack=[],redoStack=[],layers=1,docName='Untitled',background='transparent',tab='Recommended',dirty=false;
const presets={Recommended:[['Social Media Post',1080,1080,'▣'],['Social Media Story',1080,1920,'▣'],['Web media',1600,900,'▤'],['Thumb 720p',1280,720,'▶'],['Wide 1080p',1920,1080,'▶'],['Art grid',1000,1000,'🖌'],['Landscape',1920,1080,'▰'],['Square',1080,1080,'□']],Photo:[['Small',800,600,'▣'],['HD Photo',1920,1080,'▣'],['Portrait',1080,1350,'▣'],['Square',1200,1200,'□']],Social:[['Post',1080,1080,'▣'],['Story',1080,1920,'▣'],['Cover',1640,924,'▰']],Web:[['Web media',1600,900,'▤'],['Banner',1920,600,'▰'],['Wallpaper',2560,1440,'▰']],Print:[['A4',2480,3508,'▤'],['A5',1748,2480,'▤'],['Poster',2400,3600,'▤']],Video:[['Thumb 720p',1280,720,'▶'],['Wide 1080p',1920,1080,'▶'],['4K',3840,2160,'▶']]};
function renderPresets(){const grid=$('presetGrid');grid.innerHTML='';(presets[tab]||presets.Recommended).forEach(p=>{const b=document.createElement('button');b.className='preset';b.innerHTML='<div class="preseticon">'+p[3]+'</div><strong>'+p[0]+'</strong><small>'+p[1]+' × '+p[2]+' px</small>';b.onclick=()=>{document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('width').value=p[1];$('height').value=p[2]};grid.appendChild(b)})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;renderPresets()});renderPresets();
function snapshot(){undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(undoStack.length>25)undoStack.shift();redoStack=[];dirty=true;addHistory('Edit');}
function addHistory(s){const h=$('history'),d=document.createElement('div');d.className='historyitem active';d.textContent=s;h.querySelectorAll('.historyitem').forEach(x=>x.classList.remove('active'));h.prepend(d)}
function fitCanvas(){const stage=$('stage'),maxW=stage.clientWidth*.92,maxH=stage.clientHeight*.88,scale=Math.min(maxW/canvas.width,maxH/canvas.height,zoom/51);$('canvas').style.width=(canvas.width*scale)+'px';$('canvas').style.height=(canvas.height*scale)+'px';$('status').textContent=canvas.width+' × '+canvas.height+' px · '+Math.round(scale*100)+'%';$('zoomLabel').textContent=zoom+'%';$('zoom').value=zoom}
function createDoc(){const w=Math.max(1,Math.min(4096,Number($('width').value)||1920)),h=Math.max(1,Math.min(4096,Number($('height').value)||1080));docName=$('docName').value||'Untitled';canvas.width=w;canvas.height=h;background=document.querySelector('input[name=bg]:checked').value;if(background!=='transparent'){ctx.fillStyle=background==='white'?'#fff':'#000';ctx.fillRect(0,0,w,h)}undoStack=[];redoStack=[];layers=1;$('layerList').innerHTML='<div class="layerrow"><span class="layerthumb"></span><span>Background<br><small>Image</small></span><button>◉</button></div>';addHistory('New document');$('newModal').classList.add('hidden');zoom=51;fitCanvas()}
$('createDoc').onclick=createDoc;$('newDoc').onclick=()=>$('newModal').classList.remove('hidden');$('closeModal').onclick=$('cancelCreate').onclick=()=>$('newModal').classList.add('hidden');
$('bgToggle').onclick=()=>{$('bgOptions').classList.toggle('hidden');$('bgState').textContent=$('bgOptions').classList.contains('hidden')?'◯':'●'};
document.querySelectorAll('input[name=bg]').forEach(x=>x.onchange=()=>background=x.value);
$('openBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);docName=f.name.replace(/\.[^.]+$/,'');undoStack=[];redoStack=[];addHistory('Open '+f.name);fitCanvas()};img.src=URL.createObjectURL(f)};
function save(){const a=document.createElement('a');a.download=(docName||'gridless-design')+'.png';a.href=canvas.toDataURL('image/png');a.click()}$('saveBtn').onclick=save;
$('tools').querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$('tools').querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b));$('hint').textContent=({brush:'Brush tool · drag to paint',pencil:'Pencil tool · drag to draw',eraser:'Eraser · drag to erase',text:'Text tool · click to add text',shape:'Shape tool · drag to draw a rectangle',fill:'Fill with foreground colour',eyedropper:'Pick a colour from the canvas',zoom:'Zoom tool'}[tool]||b.title+' tool selected')});
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointerdown',e=>{const p=pos(e);if(tool==='text'){$('textDialog').classList.remove('hidden');$('textAdd').onclick=()=>{const t=$('textValue').value;if(t){snapshot();ctx.fillStyle=$('color').value;ctx.font=Math.max(24,canvas.width/28)+'px Arial';ctx.fillText(t,p.x,p.y);addHistory('Add text')}$('textDialog').classList.add('hidden')};$('textCancel').onclick=()=>$('textDialog').classList.add('hidden');return}if(tool==='eyedropper'){const d=ctx.getImageData(Math.round(p.x),Math.round(p.y),1,1).data;$('color').value='#'+[...d].slice(0,3).map(x=>x.toString(16).padStart(2,'0')).join('');return}if(tool==='fill'){snapshot();ctx.fillStyle=$('color').value;ctx.fillRect(0,0,canvas.width,canvas.height);addHistory('Fill canvas');return}if(!['brush','pencil','eraser','shape'].includes(tool))return;snapshot();drawing=true;last=p;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=tool==='pencil'?2:Math.max(2,canvas.width/160);ctx.strokeStyle=$('color').value;if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=Math.max(12,canvas.width/45)}else ctx.globalCompositeOperation='source-over';if(tool==='shape'){ctx.putImageData(undoStack[undoStack.length-1],0,0);ctx.strokeStyle=$('color').value;ctx.lineWidth=Math.max(2,canvas.width/500);ctx.strokeRect(last.x,last.y,p.x-last.x,p.y-last.y)}else{ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke()}ctx.globalCompositeOperation='source-over';if(tool!=='shape')last=p});
canvas.addEventListener('pointerup',()=>{if(drawing){drawing=false;addHistory(tool==='eraser'?'Erase':tool==='shape'?'Rectangle':'Draw')}});
function undo(){if(!undoStack.length)return;redoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));ctx.putImageData(undoStack.pop(),0,0);addHistory('Undo')}function redo(){if(!redoStack.length)return;undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));ctx.putImageData(redoStack.pop(),0,0);addHistory('Redo')}$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;
$('addLayer').onclick=()=>{layers++;const d=document.createElement('div');d.className='layerrow';d.innerHTML='<span class="layerthumb"></span><span>Layer '+layers+'<br><small>Empty layer</small></span><button>◉</button>';$('layerList').prepend(d);addHistory('Add layer')};$('duplicateLayer').onclick=()=>{layers++;const d=document.createElement('div');d.className='layerrow';d.innerHTML='<span class="layerthumb"></span><span>Layer '+layers+' copy<br><small>Duplicate</small></span><button>◉</button>';$('layerList').prepend(d);addHistory('Duplicate layer')};$('deleteLayer').onclick=()=>{const l=$('layerList').firstElementChild;if(l){l.remove();addHistory('Delete layer')}};
function setZoom(v){zoom=Math.max(10,Math.min(100,v));fitCanvas()}$('zoom').oninput=e=>setZoom(+e.target.value);$('zoomIn').onclick=()=>setZoom(zoom+5);$('zoomOut').onclick=()=>setZoom(zoom-5);
$('fileMenu').onclick=()=>$('fileInput').click();$('editMenu').onclick=undo;$('imageMenu').onclick=()=>alert('Image size: '+canvas.width+' × '+canvas.height+' px');$('layerMenu').onclick=()=>$('addLayer').click();$('selectMenu').onclick=()=>alert('Selection tools are available in the left toolbar.');$('adjustMenu').onclick=()=>{const b=prompt('Brightness amount (-100 to 100)','10');if(b===null)return;const d=ctx.getImageData(0,0,canvas.width,canvas.height);snapshot();const n=Number(b)*2.55;for(let i=0;i<d.data.length;i+=4){d.data[i]=Math.max(0,Math.min(255,d.data[i]+n));d.data[i+1]=Math.max(0,Math.min(255,d.data[i+1]+n));d.data[i+2]=Math.max(0,Math.min(255,d.data[i+2]+n))}ctx.putImageData(d,0,0);addHistory('Brightness')};$('filterMenu').onclick=()=>{const f=prompt('Filter: grayscale, invert, sepia','grayscale');if(!['grayscale','invert','sepia'].includes(f))return;snapshot();const d=ctx.getImageData(0,0,canvas.width,canvas.height);for(let i=0;i<d.data.length;i+=4){let r=d.data[i],g=d.data[i+1],b=d.data[i+2];if(f==='grayscale'){const v=.299*r+.587*g+.114*b;r=g=b=v}else if(f==='invert'){r=255-r;g=255-g;b=255-b}else{const nr=.393*r+.769*g+.189*b,ng=.349*r+.686*g+.168*b,nb=.272*r+.534*g+.131*b;r=nr;g=ng;b=nb}d.data[i]=r;d.data[i+1]=g;d.data[i+2]=b}ctx.putImageData(d,0,0);addHistory(f)};$('viewMenu').onclick=()=>setZoom(zoom===100?51:100);$('helpMenu').onclick=()=>alert('GridLess Photo Editor\\nCreate a canvas, open an image, draw, add text, apply basic filters and export PNG.');window.addEventListener('resize',fitCanvas);createDoc();$('newModal').classList.remove('hidden');
})();
</script></body></html>
