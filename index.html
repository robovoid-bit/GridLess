<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STL to Triangle TXT Converter</title>
<style>
  :root {
    --bg: #0c0f16;
    --panel: #131722;
    --panel-2: #191f2e;
    --border: #262e42;
    --text: #e7ebf5;
    --muted: #939eb8;
    --accent: #4f8cff;
    --accent-hover: #699fff;
    --success: #2ecc71;
    --danger: #ff5c77;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand {
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(79, 140, 255, 0.16);
    color: #9ec0ff;
    border: 1px solid rgba(79, 140, 255, 0.35);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  button, select {
    font-family: inherit;
    font-size: 12.5px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover, select:hover {
    background: #21283b;
    border-color: #3d4868;
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  button.primary:hover {
    background: var(--accent-hover);
  }

  button.success {
    background: rgba(46, 204, 113, 0.16);
    border-color: rgba(46, 204, 113, 0.45);
    color: #6ee7a0;
    font-weight: 600;
  }

  button.success:hover {
    background: rgba(46, 204, 113, 0.25);
  }

  .dropzone {
    margin: 14px 16px 0;
    border: 1.5px dashed #323c58;
    border-radius: 10px;
    padding: 14px 16px;
    background: rgba(19, 23, 34, 0.75);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(79, 140, 255, 0.12);
  }

  .dropzone p {
    font-size: 13px;
    color: var(--muted);
  }

  .dropzone strong {
    color: var(--text);
  }

  .meta-bar {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--muted);
  }

  .ok { color: #6ee7a0; }
  .err { color: var(--danger); }

  .output-wrap {
    flex: 1;
    padding: 0 16px 16px;
    display: flex;
    flex-direction: column;
    min-height: 360px;
  }

  #txtOutput {
    flex: 1;
    width: 100%;
    min-height: 380px;
    background: #090c12;
    color: #dce4f7;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    resize: vertical;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span>STL &rarr; Triangle TXT Dump</span>
      <span class="badge">Binary &amp; ASCII STL</span>
    </div>
    <div class="controls">
      <input id="stlFileInput" type="file" accept=".stl" style="display: none;" />
      <button id="pickFileBtn" class="primary">Choose .STL File</button>
      <select id="formatMode" title="Output verbosity">
        <option value="compact">Compact (1 line per triangle: T# | V1 | V2 | V3)</option>
        <option value="detailed">Detailed (Includes Normal &amp; Edge Lengths)</option>
      </select>
      <button id="copyBtn">Copy TXT</button>
      <button id="downloadTxtBtn" class="success">Download .TXT</button>
    </div>
  </header>

  <div id="dropzone" class="dropzone">
    <p><strong>Drop an .STL file here</strong> or click <strong>Choose .STL File</strong> to dump every triangle into readable text.</p>
    <span id="fileInfo" style="font-size: 12px; color: var(--muted);">No file loaded</span>
  </div>

  <div class="meta-bar">
    <span id="statusMsg" class="ok">Ready</span>
    <span id="triStats">0 triangles</span>
  </div>

  <div class="output-wrap">
    <textarea id="txtOutput" spellcheck="false" placeholder="Every triangle from your STL will appear here as plain text..."></textarea>
  </div>

  <script>
    const fileInput = document.getElementById('stlFileInput');
    const pickFileBtn = document.getElementById('pickFileBtn');
    const dropzone = document.getElementById('dropzone');
    const formatMode = document.getElementById('formatMode');
    const copyBtn = document.getElementById('copyBtn');
    const downloadTxtBtn = document.getElementById('downloadTxtBtn');
    const txtOutput = document.getElementById('txtOutput');
    const statusMsg = document.getElementById('statusMsg');
    const triStats = document.getElementById('triStats');
    const fileInfo = document.getElementById('fileInfo');

    let lastFileName = 'model';
    let lastParsed = null;

    function setStatus(msg, isOk = true) {
      statusMsg.textContent = msg;
      statusMsg.className = isOk ? 'ok' : 'err';
    }

    function isAsciiSTL(buffer) {
      const len = Math.min(buffer.byteLength, 2048);
      const bytes = new Uint8Array(buffer, 0, len);
      const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes).trimStart();
      if (!text.toLowerCase().startsWith('solid')) return false;
      // Check if there are non-ASCII/control bytes typical of binary STL
      for (let i = 0; i < len; i++) {
        const b = bytes[i];
        if (b < 9 || (b > 13 && b < 32) || b === 127) {
          return false;
        }
      }
      return /facet\s+normal/i.test(new TextDecoder().decode(new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 65536))));
    }

    function parseSTL(buffer) {
      if (isAsciiSTL(buffer)) {
        const text = new TextDecoder().decode(buffer);
        const triangles = [];
        const facetRegex = /facet\s+normal\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)([\s\S]*?)endfacet/gi;
        const vertexRegex = /vertex\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)/gi;

        let fm;
        while ((fm = facetRegex.exec(text)) !== null) {
          const n = [parseFloat(fm[1]), parseFloat(fm[2]), parseFloat(fm[3])];
          const body = fm[4];
          const verts = [];
          let vm;
          vertexRegex.lastIndex = 0;
          while ((vm = vertexRegex.exec(body)) !== null) {
            verts.push([parseFloat(vm[1]), parseFloat(vm[2]), parseFloat(vm[3])]);
          }
          if (verts.length === 3) {
            triangles.push({ n, v1: verts[0], v2: verts[1], v3: verts[2] });
          }
        }
        return { format: 'ASCII STL', triangles };
      }

      if (buffer.byteLength < 84) {
        throw new Error('File is too small to be a valid STL.');
      }

      const view = new DataView(buffer);
      const triCount = view.getUint32(80, true);
      const expectedBytes = 84 + triCount * 50;
      if (buffer.byteLength < expectedBytes) {
        throw new Error(`Incomplete binary STL: expected ${expectedBytes} bytes for ${triCount} triangles, got ${buffer.byteLength}.`);
      }

      const triangles = new Array(triCount);
      let offset = 84;
      for (let i = 0; i < triCount; i++) {
        const nx = view.getFloat32(offset, true); offset += 4;
        const ny = view.getFloat32(offset, true); offset += 4;
        const nz = view.getFloat32(offset, true); offset += 4;

        const v1x = view.getFloat32(offset, true); offset += 4;
        const v1y = view.getFloat32(offset, true); offset += 4;
        const v1z = view.getFloat32(offset, true); offset += 4;

        const v2x = view.getFloat32(offset, true); offset += 4;
        const v2y = view.getFloat32(offset, true); offset += 4;
        const v2z = view.getFloat32(offset, true); offset += 4;

        const v3x = view.getFloat32(offset, true); offset += 4;
        const v3y = view.getFloat32(offset, true); offset += 4;
        const v3z = view.getFloat32(offset, true); offset += 4;

        offset += 2; // attribute byte count

        triangles[i] = {
          n: [nx, ny, nz],
          v1: [v1x, v1y, v1z],
          v2: [v2x, v2y, v2z],
          v3: [v3x, v3y, v3z]
        };
      }

      return { format: 'Binary STL', triangles };
    }

    function fmtNum(n) {
      return Number.isFinite(n) ? n.toFixed(2) : '0.00';
    }

    function fmtVec(v) {
      return `(${fmtNum(v[0])}, ${fmtNum(v[1])}, ${fmtNum(v[2])})`;
    }

    function dist3(a, b) {
      const dx = a[0] - b[0];
      const dy = a[1] - b[1];
      const dz = a[2] - b[2];
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    function renderText(parsed, fileName, mode) {
      const { format, triangles } = parsed;
      let minX = Infinity, minY = Infinity, minZ = Infinity;
      let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

      for (const t of triangles) {
        for (const p of [t.v1, t.v2, t.v3]) {
          if (p[0] < minX) minX = p[0];
          if (p[1] < minY) minY = p[1];
          if (p[2] < minZ) minZ = p[2];
          if (p[0] > maxX) maxX = p[0];
          if (p[1] > maxY) maxY = p[1];
          if (p[2] > maxZ) maxZ = p[2];
        }
      }

      const lines = [
        `FILE: ${fileName}`,
        `FORMAT: ${format}`,
        `TRIANGLES: ${triangles.length}`,
        `BOUNDS X: [${fmtNum(minX)}, ${fmtNum(maxX)}] (size ${fmtNum(maxX - minX)})`,
        `BOUNDS Y: [${fmtNum(minY)}, ${fmtNum(maxY)}] (size ${fmtNum(maxY - minY)})`,
        `BOUNDS Z: [${fmtNum(minZ)}, ${fmtNum(maxZ)}] (size ${fmtNum(maxZ - minZ)})`,
        `--- TRIANGLES ---`
      ];

      if (mode === 'compact') {
        for (let i = 0; i < triangles.length; i++) {
          const t = triangles[i];
          lines.push(`T${i + 1}: ${fmtVec(t.v1)} -> ${fmtVec(t.v2)} -> ${fmtVec(t.v3)}`);
        }
      } else {
        for (let i = 0; i < triangles.length; i++) {
          const t = triangles[i];
          const e12 = fmtNum(dist3(t.v1, t.v2));
          const e23 = fmtNum(dist3(t.v2, t.v3));
          const e31 = fmtNum(dist3(t.v3, t.v1));
          lines.push(
            `T${i + 1}: V1=${fmtVec(t.v1)} V2=${fmtVec(t.v2)} V3=${fmtVec(t.v3)} | N=${fmtVec(t.n)} | edges=${e12},${e23},${e31}`
          );
        }
      }

      return lines.join('
');
    }

    async function processFile(file) {
      if (!file) return;
      try {
        setStatus(`Reading ${file.name}...`, true);
        const buf = await file.arrayBuffer();
        const parsed = parseSTL(buf);
        lastParsed = parsed;
        lastFileName = file.name;

        const out = renderText(parsed, file.name, formatMode.value);
        txtOutput.value = out;
        fileInfo.textContent = `${file.name} (${parsed.format})`;
        triStats.textContent = `${parsed.triangles.length.toLocaleString()} triangles`;
        setStatus(`Converted ${parsed.triangles.length.toLocaleString()} triangles to text`, true);
      } catch (err) {
        setStatus(err && err.message ? err.message : String(err), false);
      }
    }

    pickFileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        processFile(e.target.files[0]);
      }
      fileInput.value = '';
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
        processFile(e.dataTransfer.files[0]);
      }
    });

    formatMode.addEventListener('change', () => {
      if (!lastParsed) return;
      txtOutput.value = renderText(lastParsed, lastFileName, formatMode.value);
      setStatus(`Updated format (${formatMode.value})`, true);
    });

    copyBtn.addEventListener('click', async () => {
      if (!txtOutput.value) return;
      try {
        await navigator.clipboard.writeText(txtOutput.value);
        setStatus('Copied triangle text to clipboard', true);
      } catch {
        txtOutput.select();
        document.execCommand('copy');
        setStatus('Copied triangle text to clipboard', true);
      }
    });

    downloadTxtBtn.addEventListener('click', () => {
      if (!txtOutput.value) {
        setStatus('Load an .STL file first.', false);
        return;
      }
      const stem = lastFileName.replace(/\.stl$/i, '').replace(/[^a-zA-Z0-9_-]/g, '_') || 'model';
      const blob = new Blob([txtOutput.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${stem}_triangles.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus(`Downloaded ${stem}_triangles.txt`, true);
    });
  </script>
</body>
</html>
